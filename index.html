<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Focus</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f7f4;color:#222;font:16px system-ui}header,main{max-width:850px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center}h1{letter-spacing:-2px;margin:0}h2{margin-top:0}nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px}button,input,select,textarea{font:inherit;border:1px solid #ddd;border-radius:10px;padding:10px;background:white;color:inherit}button{cursor:pointer}button.active,button.primary{background:#f5d348;border-color:#f5d348}section{background:white;border:1px solid #e5e5df;border-radius:18px;padding:20px;margin-bottom:14px}.line{display:flex;align-items:center;gap:9px;padding:12px 0;border-bottom:1px solid #eee;flex-wrap:wrap}.grow{flex:1;min-width:100px}.done{text-decoration:line-through;color:#888}.tag{padding:4px 9px;border-radius:6px;background:#eee}.A{background:#f8d9d5}.B{background:#ffedaa}.C{background:#dcebdc}small{color:#777}textarea{width:100%;min-height:85px}input[type=checkbox]{width:20px;height:20px;accent-color:#d8b000}progress{width:100%;accent-color:#e7c331} .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tile{background:#f7f7f4;padding:14px;border-radius:12px}.tile strong{font-size:26px;display:block} @media(max-width:500px){header,main{padding:12px}section{padding:14px}.tiles{gap:5px}.tile{padding:9px}button{padding:8px;font-size:14px}}.timer-card{text-align:center}.timer-tabs,.timer-presets,.timer-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px 0}.timer-tabs button{flex:1}.timer-ring{width:190px;height:190px;margin:12px auto;position:relative}.timer-ring svg{width:100%;height:100%;transform:rotate(-90deg)}.timer-face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.timer-face strong{font-size:42px;font-variant-numeric:tabular-nums}.timer-actions .primary{min-width:140px}.timer-custom{margin:12px auto;max-width:180px}.timer-custom input{width:100%;text-align:center}.list-heading{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:4px 0;min-height:44px}.list-heading strong{flex:1;overflow-wrap:anywhere;font-size:1.2rem}.list-heading small{white-space:nowrap}</style><header><h1>my<span style="color:#c9a400">focus.</span></h1><small id="today"></small></header><main><nav id="nav"></nav><p id="storage-warning" hidden>Браузер не разрешает сохранение данных. Экспортируй резервную копию перед закрытием.</p><div id="app">Если этот текст не исчезает, JavaScript не запустился. Открой приложение как веб-сайт или в другом браузере.</div></main><script>window.addEventListener("error",function(e){document.getElementById("app").textContent="Ошибка запуска: "+e.message;});</script><script>
const $=id=>document.getElementById(id), day=()=>new Date().toLocaleDateString('sv-SE'), uid=()=>typeof crypto!=="undefined"&&crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();let s;try{s=JSON.parse(localStorage.getItem('myfocus-v1'))}catch{}s=s||{tasks:[],lists:[],projects:[],blocks:[],energy:{},freeze:[],review:{}};let page='Мой день',timer=null,seconds=1500;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persistStorage(){try{localStorage.setItem('myfocus-v1',JSON.stringify(s))}catch(e){document.getElementById('storage-warning').hidden=false}}function save(){syncSteps();persistStorage();render()}function add(cat){let lines=$('new').value.split('\n').map(x=>x.trim()).filter(Boolean),due=$('due').value;for(let name of lines)s.tasks.push({id:uid(),name,cat,due,created:Date.now(),done:false,project:$('project')?.value||'',repeat:$('repeat')?.value||'',steps:[],effort:$('effort')?.value||'',auto:cat==='I'});save()}function task(id){return s.tasks.find(t=>t.id===id)}function toggle(id){let t=task(id);t.done=!t.done;t.completed=t.done?day():'';for(let b of s.blocks.filter(b=>b.ids.includes(id))){if(b.ids.every(id=>task(id)?.done))b.closed=true;else if(!t.done)b.closed=false;}if(t.done&&t.repeat){let d=new Date((t.due||day())+'T12:00:00');d.setDate(d.getDate()+Number(t.repeat));while(d.toLocaleDateString('sv-SE')<=day())d.setDate(d.getDate()+Number(t.repeat));let next={...t,id:uid(),due:d.toLocaleDateString('sv-SE'),done:false,completed:'',steps:t.steps.map(x=>({...x,done:false,completed:'',childId:undefined})),origin:t.id};if(!s.tasks.some(x=>x.origin===t.id))s.tasks.push(next)}save()}function change(id,k,v){task(id)[k]=v;save()}function del(id){if(confirm('Удалить задачу?')){s.tasks=s.tasks.filter(t=>t.id!==id);save()}}function effortOptions(v=""){return [["","Не указана"],["light","Лёгкая"],["medium","Средняя"],["heavy","Высокая"]].map(([k,n])=>`<option value="${k}" ${v===k?"selected":""}>${n}</option>`).join("")}function row(t){return `<div class="line"><input type="checkbox" ${t.done?'checked':''} onchange="toggle('${t.id}')"><span class="tag ${t.cat}">${t.cat==='I'?'Inbox':t.cat}</span><span class="grow ${t.done?'done':''}">${esc(t.name)} ${t.parentId&&task(t.parentId)?`<small> · Шаг: ${esc(task(t.parentId).name)}</small>`:""} ${t.effort?'<small> · '+({light:'Лёгкая',medium:'Средняя',heavy:'Высокая'}[t.effort]||'')+'</small>':''} ${t.due?'<small> · '+esc(t.due)+'</small>':''}</span><button onclick="edit('${t.id}')">Микрошаги ${t.steps?.length? t.steps.filter(x=>x.done).length+'/'+t.steps.length:'＋'}</button><button onclick="edit('${t.id}')">⋯</button></div>`}function edit(id){let t=task(id);$('app').innerHTML=`<section><h2>Задача</h2><input id="ename" value="${esc(t.name)}"><p>Категория <select id="ecat"><option value="auto" ${t.auto?'selected':''}>Автоматически</option>${['I','A','B','C'].map(c=>`<option ${!t.auto&&c===t.cat?'selected':''}>${c}</option>`).join('')}</select></p><p>Срок <input type="date" id="edue" value="${esc(t.due||'')}"> <button type="button" onclick="clearDue('edue')">Без срока</button></p><p>Трудоёмкость <select id="eeffort">${effortOptions(t.effort)}</select></p><p>Проект <select id="eproject">${projectOptions(t.project)}</select></p><p>Повтор <select id="erepeat">${repeatOptions(t.repeat)}</select></p><h3>Микрошаги · ${t.steps.filter(x=>x.done).length}/${t.steps.length}</h3><progress max="${t.steps.length||1}" value="${t.steps.filter(x=>x.done).length}"></progress><p><button onclick="persistEdit('${id}');stepTemplates('${id}')">Разбить по шаблону</button></p>${t.steps.map((x,i)=>`<div class="line"><input type="checkbox" ${x.done?'checked':''} onchange="persistEdit('${id}');stepCheck('${id}',${i},this.checked)">${esc(x.name)} <small>${x.minutes||10} мин ${x.childId?"· В ABC":""}</small> <input type="number" min="1" max="600" value="${x.minutes||10}" aria-label="Минуты" onchange="task('${id}').steps[${i}].minutes=Math.max(1,Math.min(600,Number(this.value)||10));persistStorage()"> <button onclick="persistEdit('${id}');promoteStep('${id}',${i})">В ABC</button><button onclick="persistEdit('${id}');removeStep('${id}',${i})">×</button></div>`).join('')}<input id="step" placeholder="Новый микрошаг"><button onclick="addStep('${id}')">+</button><p><button class="primary" onclick="persistEdit('${id}');render()">Сохранить</button> <button onclick="del('${id}')">Удалить</button></p></section>`}function addStep(id){let v=$('step').value.trim();if(!v)return;persistEdit(id);task(id).steps.push({name:v,done:false,minutes:10});persistStorage();edit(id)}function linkedStep(t,x){return x.childId?task(x.childId):null}function syncSteps(){for(let t of s.tasks){for(let x of t.steps||[]){if(x.childId){let child=task(x.childId);if(child){x.done=child.done;x.completed=child.completed||'';}else delete x.childId}}}}function createStepTask(t,x,c){let child={id:uid(),name:x.name,cat:c,due:t.due,project:t.project,repeat:'',done:false,steps:[],effort:'light',created:Date.now(),auto:!!t.auto,parentId:t.id};s.tasks.push(child);x.childId=child.id;return child}function promoteStep(id,i){let t=task(id),x=t.steps[i];if(!x||x.done||linkedStep(t,x))return;let c=prompt('Категория A, B или C',t.cat==='I'?'C':t.cat);if(!['A','B','C'].includes(c))return;createStepTask(t,x,c);persistStorage();edit(id)}function stepTemplates(id){let t=task(id);let sets=[['Подготовка урока',['Открыть материалы прошлого урока','Определить цель урока','Подготовить warm-up','Подготовить упражнения','Подготовить speaking','Загрузить материалы']],['Покупка / организация',['Уточнить, что нужно','Найти варианты','Выбрать вариант','Оформить заказ или договориться']],['Большая задача',['Определить конкретный результат','Собрать необходимые материалы','Сделать первый черновик','Проверить и завершить']]];let choice=prompt('Выбери шаблон: 1 — урок, 2 — покупка / организация, 3 — большая задача','1');let set=sets[Number(choice)-1];if(!set)return;for(let name of set[1])if(!t.steps.some(x=>x.name===name))t.steps.push({name,done:false,minutes:10});persistStorage();edit(id)}function stepCheck(id,i,v){let x=task(id).steps[i],child=linkedStep(task(id),x);if(child&&child.done!==v){toggle(child.id);edit(id)}else{x.done=v;x.completed=v?day():'';persistStorage();edit(id)}}function removeStep(id,i){let t=task(id),x=t.steps[i];if(linkedStep(t,x)){alert('Сначала удали самостоятельную задачу в ABC.');return}t.steps.splice(i,1);persistStorage();edit(id)}function availableParent(t){return !(t.steps||[]).some(x=>linkedStep(t,x)&&!x.done)}function scheduleStep(t){if(!['Мало','Очень мало'].includes(energyNow())||t.cat==='A'||t.parentId)return t;let x=(t.steps||[]).find(x=>!x.done&&!linkedStep(t,x));return x?createStepTask(t,x,t.cat):t}function clearDue(id){let el=$(id);el.value='';el.dispatchEvent(new Event('change',{bubbles:true}));}function persistEdit(id){Object.assign(task(id),{name:$('ename').value,cat:$('ecat').value==='auto'?task(id).cat:$('ecat').value,auto:$('ecat').value==='auto'||$('ecat').value==='I',due:$('edue').value,effort:$('eeffort').value,project:$('eproject').value,repeat:$('erepeat').value});persistStorage()}function deleteProject(id){if(!confirm('Удалить проект?'))return;let remove=confirm('Удалить также все задачи проекта? Отмена — сохранить задачи без проекта.');if(remove){let ids=new Set(s.tasks.filter(t=>t.project===id).map(t=>t.id));s.tasks=s.tasks.filter(t=>!ids.has(t.id));s.blocks.forEach(b=>b.ids=b.ids.filter(x=>!ids.has(x)));}else s.tasks.forEach(t=>{if(t.project===id)t.project=''});s.projects=s.projects.filter(p=>p.id!==id);save()}function projectOptions(v=''){return '<option value="">Без проекта</option>'+s.projects.map(p=>`<option value="${p.id}" ${v===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}function repeatOptions(v=''){return [['','Нет'],['1','Ежедневно'],['7','Еженедельно'],['30','Каждые 30 дней']].map(([k,n])=>`<option value="${k}" ${v===k?'selected':''}>${n}</option>`).join('')}function form(cat){return `<section><textarea id="new" placeholder="Запиши всё, что приходит в голову. Каждая строка — отдельная задача."></textarea><div class="line"><input id="due" type="date" aria-label="Срок"> <button type="button" onclick="clearDue('due')">Без срока</button><select id="project">${projectOptions()}</select><select id="repeat">${repeatOptions()}</select><label>Трудоёмкость <select id="effort">${effortOptions()}</select></label><button class="primary" onclick="add('${cat}')">Добавить</button></div></section>`}function dueCategory(t){if(!t.due)return 'C';if(t.due<=day())return 'A';let d=new Date(day()+'T12:00:00');d.setDate(d.getDate()+Number(s.bWindow||7));return t.due<=d.toLocaleDateString('sv-SE')?'B':'C'}function classify(includeInbox=false){let changed=false;for(let t of s.tasks){if(t.done)continue;if(t.cat==='I'&&!includeInbox)continue;let c=dueCategory(t),old=t.cat;if(t.cat==='I'){t.auto=true;t.cat=c}else if(t.auto)t.cat=c;else if(t.due&&'ABC'.indexOf(c)<'ABC'.indexOf(t.cat))t.cat=c;if(old!==t.cat)changed=true}if(changed)persistStorage()}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function energyNow(){return s.energy[day()]||'Не отмечена'}function quotas(){return energyNow()==='Очень мало'&&s.shortBlock!==false?[1,1,1]:[1,2,3]}function dailyLimit(){return ({'Очень мало':1,'Мало':1,'Нормально':2,'Много':3})[energyNow()]||2}function cleanBlocks(){let before=JSON.stringify(s.blocks);for(let b of s.blocks)b.ids=[...new Set(b.ids.filter(id=>task(id)))];s.blocks=s.blocks.filter(b=>b.ids.length);let pending=s.blocks.filter(b=>b.date===day()&&!finished(b));let active=pending.find(b=>!b.waiting)||pending[0];for(let b of pending)b.waiting=b!==active;if(before!==JSON.stringify(s.blocks))persistStorage()}
function blockMenu(id){let targets=id?s.blocks.filter(b=>b.id===id):todayBlocks().filter(b=>!finished(b));let ids=new Set(targets.flatMap(b=>b.ids));let n=s.tasks.filter(t=>ids.has(t.id)&&!t.done).length;$('app').innerHTML=`<section><h2>${id?'Управление блоком':'Сбросить план дня'}</h2><p>Незавершённых задач: ${n}. Выполненные задачи и статистика сохранятся.</p><p><button class="primary" onclick="resetBlocks('${id}',false,false)">Вернуть задачи в ABC</button></p><p><button onclick="resetBlocks('${id}',false,true)">Вернуть и собрать новый блок</button></p><p><button onclick="resetBlocks('${id}',true,false)">Удалить незавершённые задачи</button></p><button onclick="render()">Отмена</button></section>`}
function resetBlocks(id,remove,rebuild){let targets=id?s.blocks.filter(b=>b.id===id):todayBlocks().filter(b=>!finished(b));let ids=new Set(targets.flatMap(b=>b.ids));let unfinished=new Set(s.tasks.filter(t=>ids.has(t.id)&&!t.done).map(t=>t.id));if(remove&&!confirm('Удалить '+unfinished.size+' незавершённых задач полностью? Это действие нельзя отменить.'))return;if(remove)s.tasks=s.tasks.filter(t=>!unfinished.has(t.id));else for(let t of s.tasks)if(unfinished.has(t.id)&&t.cat==='I'){t.auto=true;t.cat=dueCategory(t)}for(let b of targets){b.ids=b.ids.filter(x=>task(x)?.done);b.closed=true;if(b.ids.length){b.cancelled=true;b.target=Math.max(b.target||6,b.ids.length+1)}}cleanBlocks();page='Мой день';save();if(rebuild)block(true)}
function todayBlocks(){return s.blocks.filter(b=>b.date===day()&&b.ids.length)}function finished(b){return b.ids.every(id=>task(id)?.done)}function activeBlock(){return todayBlocks().find(b=>!finished(b)&&!b.waiting)}function flipProject(id){let p=s.projects.find(x=>x.id===id);p.open=!p.open;save()}function effortRank(t){let e=energyNow();if(e==='Мало'||e==='Очень мало')return ({light:0,medium:1,heavy:3}[t.effort]??1);if(e==='Много')return ({heavy:0,medium:1,light:2}[t.effort]??1);return 0}function block(go=false){classify(true);cleanBlocks();if(activeBlock()){page='Мой день';save();return}if(todayBlocks().filter(b=>finished(b)&&!b.cancelled).length>=dailyLimit()&&!confirm('Рекомендуемый план выполнен. Собрать дополнительный блок?'))return;let queued=todayBlocks().find(b=>b.waiting&&!finished(b));if(queued){queued.waiting=false;page='Мой день';save();return}let used=new Set(s.blocks.filter(b=>b.date===day()).flatMap(b=>b.ids));let pool=s.tasks.filter(t=>!t.done&&!used.has(t.id)&&availableParent(t));if(!pool.length){if(go)page='Мой день';save();return alert('Все доступные задачи уже в блоках или выполнены.')}do{let ids=[];for(let [c,n] of ['A','B','C'].map((c,i)=>[c,quotas()[i]])){let candidates=shuffle(pool.filter(t=>t.cat===c));if(c!=='C')candidates.sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')||(c==='B'?effortRank(a)-effortRank(b):0));else candidates=candidates.map(t=>({t,k:Math.random()**(1/(1+Math.min(30,Math.max(0,(Date.now()-(t.created||Date.now()))/86400000))/7))})).sort((a,b)=>b.k-a.k).map(x=>x.t).sort((a,b)=>effortRank(a)-effortRank(b));ids.push(...candidates.slice(0,n).map(t=>scheduleStep(t).id))}if(!ids.length)break;s.blocks.push({id:uid(),date:day(),ids,target:quotas().reduce((a,b)=>a+b,0),energy:energyNow()});pool=pool.filter(t=>!ids.includes(t.id))}while(false);if(go)page='Мой день';save()}function flipBlock(id){let b=s.blocks.find(x=>x.id===id);if(!finished(b))return;b.closed=!(b.closed!==false);save()}function replace(bid,i,id){let b=s.blocks.find(x=>x.id===bid);b.ids[i]=id;save()}function streak(){let dates=new Set(s.tasks.filter(t=>t.completed).map(t=>t.completed).concat(s.freeze));let d=new Date();if(!dates.has(day()))d.setDate(d.getDate()-1);let n=0;while(dates.has(d.toLocaleDateString('sv-SE'))){n++;d.setDate(d.getDate()-1)}return n}function timerText(){return Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0')}let timerEnd=0,timerMode='Работа',durations={'Работа':25,'Отдых':5};function paintTimer(){if($('clock'))$('clock').textContent=timerText();if($('ring'))$('ring').setAttribute('stroke-dasharray',`${565.49*Math.min(1,seconds/(durations[timerMode]*60))} 565.49`)}function pauseTimer(){if(timerEnd)seconds=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));clearInterval(timer);timerEnd=0;render()}function resumeTimer(){if(!seconds)seconds=durations[timerMode]*60;clearInterval(timer);timerEnd=Date.now()+seconds*1000;timer=setInterval(()=>{seconds=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));paintTimer();if(!seconds){clearInterval(timer);timerEnd=0;if(timerMode==='Работа'){s.focusLog=s.focusLog||[];s.focusLog.push({date:day(),minutes:durations[timerMode]});persistStorage()}render()}},250);render()}function selectTimer(n,mode=timerMode){if(!Number.isFinite(n)||n<=0||n>1440)return;clearInterval(timer);timerEnd=0;timerMode=mode;durations[mode]=n;seconds=Math.round(n*60);render()}function resetTimer(){selectTimer(durations[timerMode])}function timerCard(){return `<section class="timer-card"><div class="timer-tabs">${['Работа','Отдых'].map(m=>`<button class="${m===timerMode?'active':''}" onclick="selectTimer(durations['${m}'],'${m}')">${m==='Работа'?'Фокус':'Перерыв'}</button>`).join('')}</div><div class="timer-ring"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="90" fill="none" stroke="#eee" stroke-width="7"/><circle id="ring" cx="100" cy="100" r="90" fill="none" stroke="#e7c331" stroke-width="7" stroke-linecap="round" stroke-dasharray="${565.49*Math.min(1,seconds/(durations[timerMode]*60))} 565.49"/></svg><div class="timer-face"><strong id="clock">${timerText()}</strong><small>${timerMode==='Работа'?'ВРЕМЯ ФОКУСА':'ВРЕМЯ ОТДЫХА'}</small></div></div><div class="timer-presets">${(timerMode==='Работа'?[5,10,15,25,45,60]:[5,10,15,20]).map(n=>`<button class="${durations[timerMode]===n?'active':''}" onclick="selectTimer(${n})">${n}</button>`).join('')}</div><details class="timer-custom"><summary>Своё время</summary><input type="number" min="1" max="1440" placeholder="Минуты" onchange="selectTimer(Number(this.value))"></details><div class="timer-actions"><button class="primary" onclick="${timerEnd?'pauseTimer()':'resumeTimer()'}">${timerEnd?'Пауза':seconds===durations[timerMode]*60||!seconds?'Начать':'Продолжить'}</button><button onclick="resetTimer()">Сброс</button></div></section>`}function render(){ syncSteps(); s.energy=s.energy||{}; cleanBlocks(); classify(); $('today').textContent=new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long',weekday:'long'});$('nav').innerHTML=['Мой день','Inbox','ABC','Проекты','Списки','Статистика','Календарь','Обзор'].map(p=>`<button class="${p===page?'active':''}" onclick="page='${p}';render()">${p}</button>`).join('');let h='',done=s.tasks.filter(t=>t.done),todayDone=done.filter(t=>t.completed===day());if(page==='Inbox')h=form('I')+`<section><h2>Inbox</h2><button onclick="classify(true);save()">Распределить автоматически</button>${s.tasks.filter(t=>t.cat==='I').map(row).join('')||'<small>Здесь пока пусто.</small>'}</section>`;if(page==='ABC')h=`<section><button class="primary" onclick="block(true)">Собрать фокус-блок автоматически</button><p><button onclick="classify(true);save()">Распределить Inbox</button></p><label>Категория B: ближайшие <select onchange="s.bWindow=Number(this.value);save()">${[3,7,14,30].map(n=>`<option ${Number(s.bWindow||7)===n?'selected':''}>${n}</option>`).join('')}</select> дней</label></section>`+['A','B','C'].map(c=>`<section><h2>${c} · ${{A:'Срочные',B:'Приближающиеся',C:'Несрочные'}[c]}</h2>${s.tasks.filter(t=>t.cat===c).sort((a,b)=>a.done-b.done).map(row).join('')||'<small>Нет задач</small>'}<button onclick="page='Inbox';render()">Добавить через Inbox</button></section>`).join('');if(page==='Мой день'){h=`<section><div class="tiles"><div class="tile"><small>Серия</small><strong>🔥 ${streak()}</strong></div><div class="tile"><small>Сегодня</small><strong>${todayDone.length}</strong></div><div class="tile"><small>Inbox</small><strong>${s.tasks.filter(t=>t.cat==='I'&&!t.done).length}</strong></div></div><p>Энергия сегодня <select onchange="s.energy[day()]=this.value;save()">${['Не отмечена','Очень мало','Мало','Нормально','Много'].map(x=>`<option ${s.energy[day()]===x?'selected':''}>${x}</option>`).join('')}</select></p>${energyNow()==='Очень мало'?`<label><input type="checkbox" ${s.shortBlock!==false?'checked':''} onchange="s.shortBlock=this.checked;save()"> Облегчённый блок 1A + 1B + 1C</label>`:''}<p><small>${({'Очень мало':'Приоритет лёгким задачам. Срочные сроки сохраняются.','Мало':'Предпочтение небольшим задачам.','Много':'Предпочтение трудоёмким задачам при равной срочности.','Нормально':'Стандартный подбор по срокам и давности.'})[energyNow()]||'Отметь энергию, чтобы адаптировать подбор.'} Изменения действуют на новые блоки.</small></p><p><strong>План: ${todayBlocks().filter(b=>finished(b)&&!b.cancelled).length} из ${dailyLimit()} блоков</strong></p><p><small>Срочных вне текущего блока: ${s.tasks.filter(t=>!t.done&&(t.cat==='A'||(t.cat==='I'&&dueCategory(t)==='A'))&&!activeBlock()?.ids.includes(t.id)).length}</small></p><p><button onclick="blockMenu('')">Сбросить план дня</button></p>${activeBlock()?'':`<button class="primary" onclick="block()">${todayBlocks().filter(b=>finished(b)&&!b.cancelled).length>=dailyLimit()?'＋ Дополнительный блок':todayBlocks().length?'＋ Следующий блок':'＋ Собрать фокус-блок'}</button>`}</section>`;h+=todayBlocks().map((b,i)=>{if(!finished(b)&&b!==activeBlock())return '';let ts=b.ids.map(task).filter(Boolean),n=ts.filter(t=>t.done).length,closed=finished(b)?b.closed!==false:false;return `<section><h2><button onclick="flipBlock('${b.id}')">${closed?'▸':'▾'}</button> Фокус-блок ${i+1} · ${n}/${ts.length}${b.cancelled?' · Расформирован':''}</h2><progress max="${ts.length||1}" value="${n}"></progress>${closed?'':ts.map(row).join('')}${ts.length<(b.target||6)?'<p><small>Неполный блок: недостаточно свободных задач нужных категорий.</small></p>':''}${n===ts.length&&n&&!b.cancelled?'<p>✓ Блок завершён! Можно отдохнуть.</p>':''}${closed?'':`<button onclick="swap('${b.id}')">Заменить задачу</button>`}${finished(b)?'':` <button onclick="blockMenu('${b.id}')">Управление блоком</button>`}</section>`}).join('');h+=timerCard()+`<section><h2>Сделано сегодня</h2>${todayDone.map(row).join('')||'<small>Выполненные дела появятся здесь.</small>'}</section>`}if(page==='Проекты')h=`<section><input id="pn" placeholder="Название проекта"><button onclick="if($('pn').value.trim()){s.projects.push({id:uid(),name:$('pn').value});save()}">Добавить</button></section>`+s.projects.map(p=>{let ts=s.tasks.filter(t=>t.project===p.id);return `<section><h2><button onclick="flipProject('${p.id}')" aria-expanded="${!!p.open}">${p.open?'▾':'▸'} ${esc(p.name)}</button></h2><small>${ts.filter(t=>t.done).length}/${ts.length}</small><progress max="${ts.length||1}" value="${ts.filter(t=>t.done).length}"></progress>${p.open?`<button onclick="deleteProject('${p.id}')">Удалить проект</button>${ts.map(row).join('')}`:''}</section>`}).join('');if(page==='Списки')h=`<section><input id="ln" placeholder="Название списка"><button onclick="if($('ln').value.trim()){s.lists.push({id:uid(),name:$('ln').value,items:[],open:true});save()}">Создать</button></section>`+s.lists.map(l=>`<section><button type="button" class="list-heading" aria-expanded="${!!l.open}" onclick="flipShoppingList('${l.id}')"><span>${l.open?'▾':'▸'}</span><strong>${esc(l.name)}</strong><small>${l.items.filter(x=>x.done).length}/${l.items.length}</small></button>${l.open?` ${l.items.map((x,i)=>`<div class="line"><input type="checkbox" ${x.done?'checked':''} onchange="getShoppingList('${l.id}').items[${i}].done=this.checked;save()"><span class="grow ${x.done?'done':''}">${esc(x.name)}</span><button onclick="getShoppingList('${l.id}').items.splice(${i},1);save()">×</button></div>`).join('')}<p><input id="li${l.id}" placeholder="Новый пункт"><button onclick="addItem('${l.id}')">+</button></p><button onclick="getShoppingList('${l.id}').items.forEach(x=>x.done=false);save()">Снять отметки</button>`:''}</section>`).join('');if(page==='Статистика')h=analytics();if(page==='Календарь')h=`<section><h2>Задачи со сроком</h2>${s.tasks.filter(t=>t.due).sort((a,b)=>a.due.localeCompare(b.due)).map(row).join('')||'<small>Нет задач со сроком.</small>'}</section>`;if(page==='Обзор')h=reviewPage();$('app').innerHTML=h}function flipShoppingList(id){let l=getShoppingList(id);if(l){l.open=!l.open;save()}}function getShoppingList(id){return s.lists.find(l=>l.id===id)}function addItem(id){let v=$('li'+id).value.trim();if(v){getShoppingList(id).items.push({name:v,done:false});save()}}function swap(id){let b=s.blocks.find(x=>x.id===id);$('app').innerHTML='<section><h2>Замена задачи</h2>'+b.ids.map((tid,i)=>{let t=task(tid);if(!t||t.done)return '';return `<p>${esc(t.name)}</p><select onchange="if(this.value)replace('${id}',${i},this.value)"><option value="">Выбрать замену</option>${s.tasks.filter(x=>!x.done&&availableParent(x)&&x.cat===t.cat&&!s.blocks.filter(z=>z.date===day()).some(z=>z.ids.includes(x.id))).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select>`}).join('')+'<p><button onclick="render()">Назад</button></p></section>'}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s)],{type:'application/json'}));a.download='myfocus-backup.json';a.click()}async function restore(el){try{let x=JSON.parse(await el.files[0].text());if(!Array.isArray(x.tasks)||!Array.isArray(x.blocks)||!Array.isArray(x.lists)||!Array.isArray(x.projects))throw Error();if(confirm('Заменить текущие данные резервной копией?')){s=x;save()}}catch{alert('Не удалось прочитать копию')}}
let statPeriod=7, reviewPeriod='week';
function dateShift(k,n){let d=new Date(k+'T12:00:00');d.setDate(d.getDate()+n);return d.toLocaleDateString('sv-SE')}
function weekStart(k){let d=new Date(k+'T12:00:00');return dateShift(k,-((d.getDay()+6)%7))}
function metrics(a,b){let inside=k=>!!k&&k>=a&&k<=b,done=s.tasks.filter(t=>t.done&&inside(t.completed)),blocks=s.blocks.filter(x=>inside(x.date)),planned=[...new Set(blocks.flatMap(x=>x.ids))].map(task).filter(Boolean);return {done,blocks:blocks.filter(x=>x.ids.length&&x.ids.every(id=>task(id)?.done)),planned,finished:planned.filter(t=>t.done&&inside(t.completed)).length,steps:s.tasks.reduce((n,t)=>n+(t.steps||[]).filter(x=>x.done&&inside(x.completed)).length,0),minutes:(s.focusLog||[]).filter(x=>inside(x.date)).reduce((n,x)=>n+x.minutes,0)}}
function tile(n,v){return `<div class="tile"><small>${n}</small><strong>${v}</strong></div>`}
function summary(m){return `<div class="tiles">${tile('Задачи',m.done.length)}${tile('Блоки',m.blocks.length)}${tile('Микрошаги',m.steps)}${tile('Фокус, мин',m.minutes)}</div><p>Выполнено из текущего плана: ${m.finished}/${m.planned.length}</p>`}
function analytics(){let b=day(),a=dateShift(b,1-statPeriod),m=metrics(a,b),prev=metrics(dateShift(a,-statPeriod),dateShift(a,-1)),delta=m.done.length-prev.done.length;return `<section><h2>Статистика</h2><div class="timer-tabs">${[7,30].map(n=>`<button class="${statPeriod===n?'active':''}" onclick="statPeriod=${n};render()">${n} дней</button>`).join('')}</div>${summary(m)}<p>Серия: 🔥 ${streak()} дней · Изменение к предыдущему периоду: ${delta>0?'+':''}${delta}</p><button onclick="if(!s.freeze.includes(day())){s.freeze.push(day());save()}">Отметить день отдыха</button></section><section><h2>Баланс ABC</h2>${['A','B','C','I'].map(c=>{let n=m.done.filter(t=>t.cat===c).length;return `<div class="line"><span class="tag ${c}">${c==='I'?'Inbox':c}</span><progress class="grow" max="${Math.max(1,m.done.length)}" value="${n}"></progress>${n}</div>`}).join('')}</section><section><h2>Энергия и активность</h2>${Array.from({length:statPeriod},(_,i)=>{let k=dateShift(a,i),n=m.done.filter(t=>t.completed===k).length;return `<div class="line"><small>${k}<br>${esc(s.energy[k]||'Не отмечена')}</small><progress class="grow" max="${Math.max(1,...Array.from({length:statPeriod},(_,j)=>m.done.filter(t=>t.completed===dateShift(a,j)).length))}" value="${n}"></progress>${n}</div>`}).join('')}</section><section><h2>Проекты</h2>${s.projects.map(p=>{let ts=s.tasks.filter(t=>t.project===p.id),n=ts.filter(t=>t.done).length;return `<p>${esc(p.name)} · ${n}/${ts.length} · за период: ${m.done.filter(t=>t.project===p.id).length}</p><progress max="${Math.max(1,ts.length)}" value="${n}"></progress>`}).join('')||'Нет проектов'}</section><section><h2>Давно в очереди</h2>${s.tasks.filter(t=>!t.done&&t.created&&Date.now()-t.created>=14*86400000).map(row).join('')||'Нет задач старше 14 дней'}</section><section><small>Время фокуса и даты микрошагов учитываются с v0.10. План отражает сохранившиеся блоки, а не удалённые.</small></section>`}
function reviewKey(){return reviewPeriod+':'+(reviewPeriod==='week'?weekStart(day()):day())}
function reviewAction(id,action){let t=task(id);if(!t||t.done)return;if(action==='delete'){del(id);return}if(action==='later'){let d=prompt('Новый срок (ГГГГ-ММ-ДД)',dateShift(day(),1));if(!d||!/^\d{4}-\d{2}-\d{2}$/.test(d)||!Number.isFinite(Date.parse(d))||dateShift(d,0)!==d)return;t.due=d;t.auto=true}if(t.cat==='I')t.cat=dueCategory(t.due);s.blocks.filter(b=>b.date===day()).forEach(b=>b.ids=b.ids.filter(x=>x!==id));save()}
function reviewPage(){let a=reviewPeriod==='week'?weekStart(day()):day(),m=metrics(a,day()),key=reviewKey(),notes=(s.reviews||{})[key]||[];return `<section><h2>Обзор</h2><div class="timer-tabs">${[['day','День'],['week','Неделя']].map(([k,n])=>`<button class="${reviewPeriod===k?'active':''}" onclick="reviewPeriod='${k}';render()">${n}</button>`).join('')}</div><p>${a} — ${day()}</p>${summary(m)}<p>Задачи C: ${m.done.filter(t=>t.cat==='C').length}</p></section><section><h2>Рефлексия</h2>${['Что получилось?','Что мешало?','Что хочу изменить?'].map((q,i)=>`<p>${q}</p><textarea oninput="s.reviews=s.reviews||{};s.reviews['${key}']=s.reviews['${key}']||[];s.reviews['${key}'][${i}]=this.value;persistStorage()">${esc(notes[i]||'')}</textarea>`).join('')}<small>Ответы сохраняются автоматически.</small>${s.review&&Object.keys(s.review).length?`<details><summary>Прежние заметки</summary>${Object.entries(s.review).map(([k,v])=>`<p>${esc(k)}: ${esc(v)}</p>`).join('')}</details>`:''}</section><section><h2>Незавершённые задачи</h2>${s.tasks.filter(t=>!t.done).map(t=>`<details><summary>${esc(t.name)} · ${t.cat}</summary><p><button onclick="reviewAction('${t.id}','keep')">Вернуть в ABC</button> <button onclick="reviewAction('${t.id}','later')">Перенести срок</button> <button onclick="reviewAction('${t.id}','delete')">Удалить</button></p></details>`).join('')||'Всё выполнено'}</section><section><h2>Резервная копия</h2><button onclick="backup()">Экспорт данных</button> <input type="file" accept=".json" onchange="restore(this)"></section>`}

render();</script></html>
