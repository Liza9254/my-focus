<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Focus</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f7f4;color:#222;font:16px system-ui}header,main{max-width:850px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center}h1{letter-spacing:-2px;margin:0}h2{margin-top:0}nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px}button,input,select,textarea{font:inherit;border:1px solid #ddd;border-radius:10px;padding:10px;background:white;color:inherit}button{cursor:pointer}button.active,button.primary{background:#f5d348;border-color:#f5d348}section{background:white;border:1px solid #e5e5df;border-radius:18px;padding:20px;margin-bottom:14px}.line{display:flex;align-items:center;gap:9px;padding:12px 0;border-bottom:1px solid #eee;flex-wrap:wrap}.grow{flex:1;min-width:100px}.done{text-decoration:line-through;color:#888}.tag{padding:4px 9px;border-radius:6px;background:#eee}.A{background:#f8d9d5}.B{background:#ffedaa}.C{background:#dcebdc}small{color:#777}textarea{width:100%;min-height:85px}input[type=checkbox]{width:20px;height:20px;accent-color:#d8b000}progress{width:100%;accent-color:#e7c331} .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tile{background:#f7f7f4;padding:14px;border-radius:12px}.tile strong{font-size:26px;display:block} @media(max-width:500px){header,main{padding:12px}section{padding:14px}.tiles{gap:5px}.tile{padding:9px}button{padding:8px;font-size:14px}}.timer-card{text-align:center}.timer-tabs,.timer-presets,.timer-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px 0}.timer-tabs button{flex:1}.timer-ring{width:190px;height:190px;margin:12px auto;position:relative}.timer-ring svg{width:100%;height:100%;transform:rotate(-90deg)}.timer-face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.timer-face strong{font-size:42px;font-variant-numeric:tabular-nums}.timer-actions .primary{min-width:140px}.timer-custom{margin:12px auto;max-width:180px}.timer-custom input{width:100%;text-align:center}.list-heading{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:4px 0;min-height:44px}.list-heading strong{flex:1;overflow-wrap:anywhere;font-size:1.2rem}.list-heading small{white-space:nowrap} .focus-toast{position:fixed;bottom: max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(90%,420px);z-index:20;background:#fff9dc;border:1px solid #e6c64b;border-radius:18px;padding:18px;box-shadow:0 6px 25px #0002;text-align:center;pointer-events:none}.focus-toast b{display:block;font-size:25px;color:#a88900}.focus-toast.animate b{animation:focus-pop .55s ease-out}.focus-toast.animate{animation:focus-in .3s ease-out}@keyframes focus-pop{0%{transform:scale(.3) rotate(-15deg)}65%{transform:scale(1.3)}100%{transform:scale(1)}}@keyframes focus-in{from{opacity:0;translate:0 12px}to{opacity:1;translate:0 0}}.enough{text-align:center;background:#fff9dc;border-color:#e6c64b}.enough .primary{width:100%;margin:8px 0}.enough-mark{font-size:32px;color:#a88900}@media(prefers-reduced-motion:reduce){.focus-toast.animate,.focus-toast.animate b{animation:none}}.habit-week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.habit-week label{display:flex;flex-direction:column;align-items:center;font-size:12px}.habit-week button{padding:7px 0}.habit-card .line{border:0;padding:0}.habit-name{text-align:left;background:transparent;border:0;font-weight:600}.habit-ring{width:200px;height:200px;border-radius:50%;margin:24px auto;display:grid;place-items:center}.habit-ring>div{background:#fff9e9;width:174px;height:174px;border-radius:50%;display:flex;flex-direction:column;justify-content:center}.habit-ring strong{font-size:42px}#hv,#hg,#hs{width:110px}</style><header><h1>my<span style="color:#c9a400">focus.</span></h1><small id="today"></small></header><main><nav id="nav"></nav><p id="storage-warning" hidden>Браузер не разрешает сохранение данных. Экспортируй резервную копию перед закрытием.</p><div id="app">Если этот текст не исчезает, JavaScript не запустился. Открой приложение как веб-сайт или в другом браузере.</div></main><script>window.addEventListener("error",function(e){document.getElementById("app").textContent="Ошибка запуска: "+e.message;});</script><script>
const $=id=>document.getElementById(id), day=()=>new Date().toLocaleDateString('sv-SE'), uid=()=>typeof crypto!=="undefined"&&crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();let s;try{s=JSON.parse(localStorage.getItem('myfocus-v1'))}catch{}s=s||{tasks:[],lists:[],projects:[],blocks:[],energy:{},freeze:[],review:{}};let page='Мой день',timer=null,seconds=1500;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persistStorage(){try{localStorage.setItem('myfocus-v1',JSON.stringify(s))}catch(e){document.getElementById('storage-warning').hidden=false}}function save(){syncSteps();persistStorage();render()}function add(cat){let lines=$('new').value.split('\n').map(x=>x.trim()).filter(Boolean),due=$('due').value,repeat=readRepeat('repeat');if(repeat===null)return;due=repeatDue(due,repeat);for(let name of lines)s.tasks.push({id:uid(),name,cat,due,created:Date.now(),done:false,project:$('project')?.value||'',repeat,steps:[],effort:$('effort')?.value||'',auto:cat==='I'});save()}function task(id){return s.tasks.find(t=>t.id===id)}function toggle(id){let t=task(id),before=completedBlocks();t.done=!t.done;t.completed=t.done?day():'';for(let b of s.blocks.filter(b=>b.ids.includes(id))){if(b.ids.every(id=>task(id)?.done))b.closed=true;else if(!t.done)b.closed=false;}if(!t.done&&t.repeat){let next=s.tasks.find(x=>x.origin===t.id&&!x.done);if(next&&!s.blocks.some(b=>b.ids.includes(next.id)))s.tasks=s.tasks.filter(x=>x.id!==next.id)}if(t.done&&t.repeat){let nextDue=nextRepeat(t);let next={...t,id:uid(),due:nextDue,created:Date.now(),done:false,completed:'',steps:t.steps.map(x=>({...x,done:false,completed:'',childId:undefined})),origin:t.id,stepMode:'whole'};if(!s.tasks.some(x=>x.origin===t.id))s.tasks.push(next)}save();if(t.parentId){let parent=task(t.parentId);if(parent&&parent.steps.length&&parent.steps.every(x=>x.done)&&!parent.done)toggle(parent.id);else if(parent&&parent.done&&!t.done)toggle(parent.id)}if(t.done)celebrate(completedBlocks()>before? (completedBlocks()>=dailyLimit()?"day":"block") : t.parentId?"step":t.cat==="C"?"c":"task")}function change(id,k,v){task(id)[k]=v;save()}function del(id){if(confirm('Удалить задачу?')){s.tasks=s.tasks.filter(t=>t.id!==id);save()}}function effortOptions(v=""){return [["","Не указана"],["light","Лёгкая"],["medium","Средняя"],["heavy","Высокая"]].map(([k,n])=>`<option value="${k}" ${v===k?"selected":""}>${n}</option>`).join("")}let openSteps=new Set();
function inlineSteps(t){let n=t.steps.filter(x=>x.done).length,open=openSteps.has(t.id),phrase=n===0?'Не нужно делать всё сразу.':n===t.steps.length?'Шаг за шагом — получилось!':n===1?'Ты уже начала!':n===t.steps.length-1?'Остался один шаг.':'Смотри, сколько уже сделано.';return `<div style="margin:0 0 10px 24px;padding:10px;background:#fff4cb;border-radius:12px"><button style="width:100%;text-align:left" aria-expanded="${open}" onclick="flipSteps('${t.id}')">${open?'▾':'▸'} Начать с малого · ${n}/${t.steps.length}</button>${prefs().phrases!==false?`<small>${phrase}</small>`:''}<progress max="${t.steps.length}" value="${n}"></progress>${open?t.steps.map((x,i)=>`<label class="line"><input type="checkbox" ${x.done?'checked':''} onchange="inlineCheck('${t.id}',${i},this.checked)"><span class="grow ${x.done?'done':''}">${esc(x.name)} ${x.childId?' · В ABC':''}</span></label>`).join(''):''}</div>`}
function flipSteps(id){if(openSteps.has(id))openSteps.delete(id);else openSteps.add(id);render()}
function inlineCheck(id,i,v){let t=task(id),x=t.steps[i],child=linkedStep(t,x);if(child){if(child.done!==v)toggle(child.id);return}x.done=v;x.completed=v?day():'';if(t.steps.every(x=>x.done)&&!t.done){toggle(id);return}if(!v&&t.done){toggle(id);return}save();if(v)celebrate('step')}
function splitAll(id){let t=task(id);if(!t.steps.length)return alert('Сначала добавь микрошаги.');if(!confirm('Вынести все незавершённые шаги в ABC?'))return;t.stepMode='split';for(let x of t.steps)if(!x.done&&!linkedStep(t,x))createStepTask(t,x,t.cat==='I'?'C':t.cat);for(let b of s.blocks)if(!t.done)b.ids=b.ids.filter(x=>x!==id);save();edit(id)}
function returnStep(id,i){let t=task(id),x=t.steps[i],child=linkedStep(t,x);if(!child)return;if(!confirm('Вернуть шаг внутрь задачи?'))return;x.done=child.done;x.completed=child.completed||'';s.tasks=s.tasks.filter(y=>y.id!==child.id);delete x.childId;t.stepMode='whole';save();edit(id)}
function wholeMode(id){let t=task(id);if(!confirm('Вернуть самостоятельные шаги внутрь задачи?'))return;for(let x of t.steps){let child=linkedStep(t,x);if(child){x.done=child.done;x.completed=child.completed||'';s.tasks=s.tasks.filter(y=>y.id!==child.id);delete x.childId}}t.stepMode='whole';save();edit(id)}
function row(t){return `<div class="line"><input type="checkbox" ${t.done?'checked':''} onchange="toggle('${t.id}')"><span class="tag ${t.cat}">${t.cat==='I'?'Inbox':t.cat}</span><span class="grow ${t.done?'done':''}">${esc(t.name)} ${t.parentId&&task(t.parentId)?`<small> · Шаг: ${esc(task(t.parentId).name)}</small>`:""} ${t.effort?'<small> · '+({light:'Лёгкая',medium:'Средняя',heavy:'Высокая'}[t.effort]||'')+'</small>':''} ${t.due?'<small> · '+esc(t.due)+'</small>':''}${t.repeat?'<small> · ↻ '+esc(repeatLabel(t.repeat))+'</small>':''}</span><button onclick="edit('${t.id}')">Микрошаги ${t.steps?.length? t.steps.filter(x=>x.done).length+'/'+t.steps.length:'＋'}</button><button onclick="edit('${t.id}')">⋯</button></div>${page==='Мой день'&&t.steps?.length?inlineSteps(t):''}`}function edit(id){let t=task(id);$('app').innerHTML=`<section><h2>Задача</h2><input id="ename" value="${esc(t.name)}"><p>Категория <select id="ecat"><option value="auto" ${t.auto?'selected':''}>Автоматически</option>${['I','A','B','C'].map(c=>`<option ${!t.auto&&c===t.cat?'selected':''}>${c}</option>`).join('')}</select></p><p>Срок <input type="date" id="edue" value="${esc(t.due||'')}"> <button type="button" onclick="clearDue('edue')">Без срока</button></p><p>Трудоёмкость <select id="eeffort">${effortOptions(t.effort)}</select></p><p>Проект <select id="eproject">${projectOptions(t.project)}</select></p><p>Повтор ${repeatControl('erepeat',t.repeat)}</p><h3>Микрошаги · ${t.steps.filter(x=>x.done).length}/${t.steps.length}</h3><progress max="${t.steps.length||1}" value="${t.steps.filter(x=>x.done).length}"></progress><p><small>Режим: ${t.stepMode==='split'?'Самостоятельные задачи':'Цельная задача / смешанный'}</small></p><p><button onclick="if(persistEdit('${id}'))wholeMode('${id}')">Цельная задача</button> <button onclick="if(persistEdit('${id}'))splitAll('${id}')">Разделить все</button></p><p><button onclick="persistEdit('${id}');stepTemplates('${id}')">Разбить по шаблону</button></p>${t.steps.map((x,i)=>`<div class="line"><input type="checkbox" ${x.done?'checked':''} onchange="persistEdit('${id}');stepCheck('${id}',${i},this.checked)">${esc(x.name)} <small>${x.minutes||10} мин ${x.childId?"· В ABC":""}</small> <input type="number" min="1" max="600" value="${x.minutes||10}" aria-label="Минуты" onchange="task('${id}').steps[${i}].minutes=Math.max(1,Math.min(600,Number(this.value)||10));persistStorage()"> <button onclick="persistEdit('${id}');promoteStep('${id}',${i})">В ABC</button>${x.childId?`<button onclick="if(persistEdit('${id}'))returnStep('${id}',${i})">Вернуть внутрь</button>`:''}<button onclick="persistEdit('${id}');removeStep('${id}',${i})">×</button></div>`).join('')}<input id="step" placeholder="Новый микрошаг"><button onclick="addStep('${id}')">+</button><p><button class="primary" onclick="if(persistEdit('${id}'))render()">Сохранить</button> <button onclick="del('${id}')">Удалить</button></p></section>`}function addStep(id){let v=$('step').value.trim();if(!v)return;persistEdit(id);task(id).steps.push({name:v,done:false,minutes:10});persistStorage();edit(id)}function linkedStep(t,x){return x.childId?task(x.childId):null}function syncSteps(){for(let t of s.tasks){for(let x of t.steps||[]){if(x.childId){let child=task(x.childId);if(child){x.done=child.done;x.completed=child.completed||'';}else delete x.childId}}}}function createStepTask(t,x,c){let child={id:uid(),name:x.name,cat:c,due:t.due,project:t.project,repeat:'',done:false,steps:[],effort:'light',created:Date.now(),auto:!!t.auto,parentId:t.id};s.tasks.push(child);x.childId=child.id;return child}function promoteStep(id,i){let t=task(id),x=t.steps[i];if(!x||x.done||linkedStep(t,x))return;let c=prompt('Категория A, B или C',t.cat==='I'?'C':t.cat);if(!['A','B','C'].includes(c))return;createStepTask(t,x,c);persistStorage();edit(id)}function stepTemplates(id){let t=task(id);let sets=[['Подготовка урока',['Открыть материалы прошлого урока','Определить цель урока','Подготовить warm-up','Подготовить упражнения','Подготовить speaking','Загрузить материалы']],['Покупка / организация',['Уточнить, что нужно','Найти варианты','Выбрать вариант','Оформить заказ или договориться']],['Большая задача',['Определить конкретный результат','Собрать необходимые материалы','Сделать первый черновик','Проверить и завершить']]];let choice=prompt('Выбери шаблон: 1 — урок, 2 — покупка / организация, 3 — большая задача','1');let set=sets[Number(choice)-1];if(!set)return;for(let name of set[1])if(!t.steps.some(x=>x.name===name))t.steps.push({name,done:false,minutes:10});persistStorage();edit(id)}function stepCheck(id,i,v){let x=task(id).steps[i],child=linkedStep(task(id),x);if(child&&child.done!==v){toggle(child.id);edit(id)}else{x.done=v;x.completed=v?day():'';let t=task(id);if(t.steps.every(x=>x.done)&&!t.done)toggle(id);else if(!v&&t.done)toggle(id);persistStorage();edit(id);if(v)celebrate("step")}}function removeStep(id,i){let t=task(id),x=t.steps[i];if(linkedStep(t,x)){alert('Сначала удали самостоятельную задачу в ABC.');return}t.steps.splice(i,1);persistStorage();edit(id)}function availableParent(t){return t.stepMode!=='split'}function scheduleStep(t){return t}
function clearDue(id){let el=$(id);el.value='';el.dispatchEvent(new Event('change',{bubbles:true}));}function persistEdit(id){let repeat=readRepeat('erepeat');if(repeat===null)return false;Object.assign(task(id),{name:$('ename').value,cat:$('ecat').value==='auto'?task(id).cat:$('ecat').value,auto:$('ecat').value==='auto'||$('ecat').value==='I',due:repeatDue($('edue').value,repeat),effort:$('eeffort').value,project:$('eproject').value,repeat});persistStorage();return true}function deleteProject(id){if(!confirm('Удалить проект?'))return;let remove=confirm('Удалить также все задачи проекта? Отмена — сохранить задачи без проекта.');if(remove){let ids=new Set(s.tasks.filter(t=>t.project===id).map(t=>t.id));s.tasks=s.tasks.filter(t=>!ids.has(t.id));s.blocks.forEach(b=>b.ids=b.ids.filter(x=>!ids.has(x)));}else s.tasks.forEach(t=>{if(t.project===id)t.project=''});s.projects=s.projects.filter(p=>p.id!==id);save()}function projectOptions(v=''){return '<option value="">Без проекта</option>'+s.projects.map(p=>`<option value="${p.id}" ${v===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}function repeatControl(id,v=''){let custom=String(v).startsWith('wd:');return `<select id="${id}" onchange="document.getElementById('${id}days').hidden=this.value!=='weekdays'">${repeatOptions(custom?'weekdays':v)}<option value="weekdays" ${custom?'selected':''}>По дням недели</option></select><span id="${id}days" ${custom?'':'hidden'} style="flex-basis:100%">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map((n,i)=>`<label style="display:inline-flex;align-items:center;margin:4px;gap:3px"><input type="checkbox" data-weekday="${(i+1)%7}" ${custom&&v.slice(3).split(',').includes(String((i+1)%7))?'checked':''}>${n}</label>`).join('')}</span>`}
function readRepeat(id){let v=$(id).value;if(v!=='weekdays')return v;let days=[...$(id+'days').querySelectorAll('input:checked')].map(x=>x.dataset.weekday);if(!days.length){alert('Выбери хотя бы один день недели');return null}return 'wd:'+days.join(',')}
function matchesRepeat(k,r){return r.slice(3).split(',').includes(String(new Date(k+'T12:00:00').getDay()))}
function repeatDue(d,r){if(!r)return d;let k=d||day();if(String(r).startsWith('wd:'))while(!matchesRepeat(k,r))k=dateShift(k,1);return k}
function nextRepeat(t){let r=String(t.repeat),k=t.due||day();if(r.startsWith('wd:')){k=k>day()?k:day();do{k=dateShift(k,1)}while(!matchesRepeat(k,r));return k}let n=Number(r);if(!Number.isFinite(n)||n<1)return dateShift(day(),1);do{k=dateShift(k,n)}while(k<=day());return k}
function repeatLabel(r){if(!r)return '';if(String(r).startsWith('wd:'))return r.slice(3).split(',').map(x=>['Вс','Пн','Вт','Ср','Чт','Пт','Сб'][Number(x)]).join(', ');return ({1:'Ежедневно',7:'Еженедельно',30:'Каждые 30 дней'})[r]||''}
function repeatOptions(v=''){return [['','Нет'],['1','Ежедневно'],['7','Еженедельно'],['30','Каждые 30 дней']].map(([k,n])=>`<option value="${k}" ${v===k?'selected':''}>${n}</option>`).join('')}function form(cat){return `<section><textarea id="new" placeholder="Запиши всё, что приходит в голову. Каждая строка — отдельная задача."></textarea><div class="line"><input id="due" type="date" aria-label="Срок"> <button type="button" onclick="clearDue('due')">Без срока</button><select id="project">${projectOptions()}</select>${repeatControl('repeat')}<label>Трудоёмкость <select id="effort">${effortOptions()}</select></label><button class="primary" onclick="add('${cat}')">Добавить</button></div></section>`}function dueCategory(t){if(!t.due)return 'C';if(t.due<=day())return 'A';let d=new Date(day()+'T12:00:00');d.setDate(d.getDate()+Number(s.bWindow||7));return t.due<=d.toLocaleDateString('sv-SE')?'B':'C'}function classify(includeInbox=false){let changed=false;for(let t of s.tasks){if(t.done)continue;if(t.cat==='I'&&!includeInbox)continue;let c=dueCategory(t),old=t.cat;if(t.cat==='I'){t.auto=true;t.cat=c}else if(t.auto)t.cat=c;else if(t.due&&'ABC'.indexOf(c)<'ABC'.indexOf(t.cat))t.cat=c;if(old!==t.cat)changed=true}if(changed)persistStorage()}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function energyNow(){return s.energy[day()]||'Не отмечена'}function quotas(){return energyNow()==='Очень мало'&&s.shortBlock!==false?[1,1,1]:[1,2,3]}function dailyLimit(){return ({'Очень мало':1,'Мало':1,'Нормально':2,'Много':3})[energyNow()]||2}function cleanBlocks(){let before=JSON.stringify(s.blocks);for(let b of s.blocks)b.ids=[...new Set(b.ids.filter(id=>task(id)))];s.blocks=s.blocks.filter(b=>b.ids.length);let pending=s.blocks.filter(b=>b.date===day()&&!finished(b));let active=pending.find(b=>!b.waiting)||pending[0];for(let b of pending)b.waiting=b!==active;if(before!==JSON.stringify(s.blocks))persistStorage()}
function blockMenu(id){let targets=id?s.blocks.filter(b=>b.id===id):todayBlocks().filter(b=>!finished(b));let ids=new Set(targets.flatMap(b=>b.ids));let n=s.tasks.filter(t=>ids.has(t.id)&&!t.done).length;$('app').innerHTML=`<section><h2>${id?'Управление блоком':'Сбросить план дня'}</h2><p>Незавершённых задач: ${n}. Выполненные задачи и статистика сохранятся.</p><p><button class="primary" onclick="resetBlocks('${id}',false,false)">Вернуть задачи в ABC</button></p><p><button onclick="resetBlocks('${id}',false,true)">Вернуть и собрать новый блок</button></p><p><button onclick="resetBlocks('${id}',true,false)">Удалить незавершённые задачи</button></p><button onclick="render()">Отмена</button></section>`}
function resetBlocks(id,remove,rebuild){let targets=id?s.blocks.filter(b=>b.id===id):todayBlocks().filter(b=>!finished(b));let ids=new Set(targets.flatMap(b=>b.ids));let unfinished=new Set(s.tasks.filter(t=>ids.has(t.id)&&!t.done).map(t=>t.id));if(remove&&!confirm('Удалить '+unfinished.size+' незавершённых задач полностью? Это действие нельзя отменить.'))return;if(remove)s.tasks=s.tasks.filter(t=>!unfinished.has(t.id));else for(let t of s.tasks)if(unfinished.has(t.id)&&t.cat==='I'){t.auto=true;t.cat=dueCategory(t)}for(let b of targets){b.ids=b.ids.filter(x=>task(x)?.done);b.closed=true;if(b.ids.length){b.cancelled=true;b.target=Math.max(b.target||6,b.ids.length+1)}}cleanBlocks();page='Мой день';save();if(rebuild)block(true)}

let toastTimer;
function prefs(){return s.support||{}}
function setSupport(k,v){s.support=s.support||{};s.support[k]=v;save()}
function completedBlocks(){return todayBlocks().filter(b=>finished(b)&&!b.cancelled).length}
function dayClosed(){return !!s.closedDays?.[day()]}
function celebrate(kind){let p=prefs();if(p.phrases===false&&p.animation===false)return;document.querySelector('.focus-toast')?.remove();clearTimeout(toastTimer);let el=document.createElement('div');el.className='focus-toast'+(p.animation===false?'':' animate');el.setAttribute('role','status');let options=(supportPhrases[p.tone]||supportPhrases.soft)[kind];el.innerHTML=(p.animation===false?'':'<b aria-hidden="true">✦ ✓ ✦</b>')+(p.phrases===false?'':esc(options[Math.floor(Math.random()*options.length)]));document.body.appendChild(el);toastTimer=setTimeout(()=>el.remove(),3000)}
function finishDay(){s.closedDays=s.closedDays||{};s.closedDays[day()]=true;if(timerEnd&&timerMode==='Работа')pauseTimer();save();celebrate('day')}
function reopenDay(){if(s.closedDays)delete s.closedDays[day()];save()}
function enoughCard(){if(dayClosed())return `<section class="enough"><div class="enough-mark">✓</div><h2>День завершён</h2><p>Задачи сохранены. Можно отдыхать.</p><button onclick="reopenDay()">Вернуться к плану</button></section>`;let reached=completedBlocks()>=dailyLimit();return reached?`<section class="enough"><div class="enough-mark">✦</div><h2>На сегодня достаточно</h2><p>Рекомендованный план выполнен. Необязательно делать больше.</p><button class="primary" onclick="finishDay()">Завершить день</button><button onclick="block()">Дополнительный блок</button></section>`:`<section><button onclick="finishDay()">Завершить день раньше</button><small> · Незавершённые задачи сохранятся.</small></section>`}
function supportSettings(){let p=prefs();return `<section><h2>Поддержка</h2><p><label><input type="checkbox" ${p.phrases!==false?'checked':''} onchange="setSupport('phrases',this.checked)"> Поддерживающие фразы</label></p><p><label><input type="checkbox" ${p.animation!==false?'checked':''} onchange="setSupport('animation',this.checked)"> Анимации</label></p><label>Тон общения <select onchange="setSupport('tone',this.value)">${[['soft','Мягкий'],['neutral','Нейтральный'],['friendly','Дружеский'],['fun','С юмором']].map(([k,n])=>`<option value="${k}" ${(p.tone||'soft')===k?'selected':''}>${n}</option>`).join('')}</select></label><p><button onclick="celebrate('task')">Посмотреть пример</button></p></section>`}
let habitDate=day(),habitOpen='',habitEdit='',habitTimer=null;
const habitColors=['#F9EACB','#F8F1CF','#E3EDE0','#DFF2F8','#EDE5F6','#F8E5DF'];
function habits(){return s.habits||(s.habits=[])}
function habit(id){return habits().find(h=>h.id===id)}
function hlog(h,d=habitDate){return (h.logs||(h.logs={}))[d]||{value:0,note:''}}
function hscheduled(h,d){return h.days.includes((new Date(d+'T12:00:00').getDay()+6)%7)}
function habitSet(id,v){let h=habit(id),old=hlog(h);v=Math.max(0,Number(v)||0);h.logs[habitDate]={...old,value:v};save();if(old.value<h.goal&&v>=h.goal)celebrate('task')}
function habitAdd(id,n){habitSet(id,hlog(habit(id)).value+n)}
function habitNote(id,v){let h=habit(id);h.logs[habitDate]={...hlog(h),note:v};persistStorage()}
function habitForm(id=''){habitEdit=id||'new';habitOpen='';render()}
function habitSave(){let old=habit(habitEdit),name=$('hn').value.trim(),type=$('ht').value,goal=type==='check'?1:Number($('hg').value),step=type==='check'?1:Number($('hs').value),days=[...document.querySelectorAll('.hday:checked')].map(x=>Number(x.value));if(!name||!Number.isFinite(goal)||goal<=0||!Number.isFinite(step)||step<=0||!days.length)return alert('Укажи название, положительную цель, шаг и дни.');let h={id:old?.id||uid(),name,type,goal,step,days,emoji:$('he').value.trim()||'✦',unit:type==='time'?'мин':type==='volume'?'мл':type==='check'?'':$('hu').value.trim()||'раз',color:$('hc').value,mode:$('hm').value,logs:old?.logs||{},created:old?.created||day()};if(old)Object.assign(old,h);else habits().push(h);habitEdit='';save()}
function habitDelete(id){if(confirm('Удалить привычку и её историю?')){s.habits=habits().filter(h=>h.id!==id);habitOpen='';habitEdit='';save()}}
function habitShift(n){let d=new Date(habitDate+'T12:00:00');d.setDate(d.getDate()+n);habitDate=d.toLocaleDateString('sv-SE');render()}
function habitStart(id){if(habitTimer)return alert('Сначала останови текущий таймер привычки.');habitTimer={id,date:habitDate,start:Date.now()};render()}
function habitStop(){if(!habitTimer)return;let t=habitTimer;habitTimer=null;let h=habit(t.id);if(!h)return;let d=habitDate;habitDate=t.date;habitAdd(h.id,Math.round((Date.now()-t.start)/600)/100);habitDate=d;render()}
setInterval(()=>{let el=$('habit-clock');if(el&&habitTimer){let n=Math.floor((Date.now()-habitTimer.start)/1000);el.textContent=Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}},500);
function habitScreen(){let h=habit(habitEdit);if(habitEdit){let x=h||{name:'',emoji:'',type:'check',goal:1,step:1,unit:'раз',days:[0,1,2,3,4,5,6],color:habitColors[0],mode:'only'};return `<section><h2>${h?'Редактировать':'Новая привычка'}</h2><p>Название <input id="hn" value="${esc(x.name)}"></p><p>Эмодзи <input id="he" value="${esc(x.emoji)}"></p><p>Тип <select id="ht">${[['check','Галочка'],['time','Время'],['count','Количество'],['volume','Объём'],['custom','Своя единица']].map(([k,n])=>`<option value="${k}" ${x.type===k?'selected':''}>${n}</option>`).join('')}</select></p><p>Цель <input id="hg" type="number" min="0.01" step="any" value="${x.goal}"></p><p>Шаг плюсика <input id="hs" type="number" min="0.01" step="any" value="${x.step}"></p><p>Единица (для количества / своей) <input id="hu" value="${esc(x.unit)}"></p><p>Дни недели</p><div class="habit-week">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map((n,i)=>`<label><input class="hday" type="checkbox" value="${i}" ${x.days.includes(i)?'checked':''}>${n}</label>`).join('')}</div><p>Цвет <select id="hc">${habitColors.map((c,i)=>`<option value="${c}" style="background:${c}" ${x.color===c?'selected':''}>${['Песочный','Жёлтый','Зелёный','Голубой','Лиловый','Розовый'][i]}</option>`).join('')}</select></p><p>Назначение <select id="hm"><option value="only">Только трекер</option><option value="rest" ${x.mode==='rest'?'selected':''}>Восстановление</option></select></p><button class="primary" onclick="habitSave()">Сохранить</button> <button onclick="habitEdit='';render()">Отмена</button></section>`}h=habit(habitOpen);if(h){let l=hlog(h),p=Math.min(1,l.value/h.goal),total=Object.values(h.logs).reduce((a,b)=>a+b.value,0);return `<section style="background:${habitColors.includes(h.color)?h.color:habitColors[0]};text-align:center"><button onclick="habitOpen='';render()">← Назад</button> <button onclick="habitForm('${h.id}')">Настройки</button><h2>${esc(h.emoji)} ${esc(h.name)}</h2><div class="habit-ring" style="background:conic-gradient(#b99b36 ${p*360}deg,#ffffffaa 0)"><div><strong>${Number(l.value.toFixed(2))}</strong><small> / ${h.goal} ${esc(h.unit)}</small></div></div><p><button onclick="habitAdd('${h.id}',-${h.step})">−</button> <button class="primary" onclick="habitAdd('${h.id}',${h.step})">+ ${h.step} ${esc(h.unit)}</button></p><p><input id="hv" type="number" min="0" step="any" value="${l.value}"> <button onclick="habitSet('${h.id}',$('hv').value)">Установить</button></p>${h.type==='time'?`<p id="habit-clock">${habitTimer?.id===h.id?'…':'0:00'}</p><button onclick="${habitTimer?.id===h.id?'habitStop()':`habitStart('${h.id}')`}">${habitTimer?.id===h.id?'Остановить и записать':'Запустить таймер'}</button>`:''}<p>Заметка</p><textarea onchange="habitNote('${h.id}',this.value)">${esc(l.note)}</textarea></section><section><h3>История · 30 дней</h3><div class="habit-week">${Array.from({length:30},(_,i)=>{let d=new Date(habitDate+'T12:00:00');d.setDate(d.getDate()-29+i);let k=d.toLocaleDateString('sv-SE'),v=hlog(h,k).value;return `<button title="${k}: ${v}" style="background:${v>=h.goal?'#f5d348':v>0?'#faedb7':'#f4f4f4'}" onclick="habitDate='${k}';render()">${d.getDate()}</button>`}).join('')}</div><p>Всего: ${Number(total.toFixed(2))} ${esc(h.unit)} · Дней с прогрессом: ${Object.values(h.logs).filter(l=>l.value>0).length}</p><button onclick="habitDelete('${h.id}')">Удалить привычку</button></section>`}let list=habits().filter(h=>hscheduled(h,habitDate)||hlog(h).value>0);return `<section><h2>Трекер</h2><div class="line"><button onclick="habitShift(-1)">←</button><strong class="grow">${habitDate}</strong><button onclick="habitShift(1)">→</button><button onclick="habitDate=day();render()">Сегодня</button></div><p>${list.filter(h=>hlog(h).value>=h.goal).length} из ${list.length} целей</p><button class="primary" onclick="habitForm()">+ Привычка</button>${habitTimer?'<p><button onclick="habitStop()">Остановить таймер привычки и записать</button></p>':''}</section>${list.map(h=>{let v=hlog(h).value;return `<section class="habit-card" style="background:${habitColors.includes(h.color)?h.color:habitColors[0]}"><div class="line"><button class="grow habit-name" onclick="habitOpen='${h.id}';render()">${esc(h.emoji)} ${esc(h.name)}<br><small>${Number(v.toFixed(2))} / ${h.goal} ${esc(h.unit)} ${h.mode==='rest'?'· Восстановление':''}</small></button><button onclick="${h.type==='check'?`habitSet('${h.id}',${v>=1?0:1})`:`habitAdd('${h.id}',${h.step})`}">${v>=h.goal?'✓':'+'}</button></div><progress max="${h.goal}" value="${v}"></progress></section>`}).join('')}<section><details><summary>Все привычки и настройки</summary>${habits().map(h=>`<div class="line"><span class="grow">${esc(h.name)}</span><button onclick="habitForm('${h.id}')">Изменить</button></div>`).join('')}</details></section>`}

render();</script></html>
