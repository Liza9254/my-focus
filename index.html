<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Focus</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f7f4;color:#222;font:16px system-ui}header,main{max-width:850px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center}h1{letter-spacing:-2px;margin:0}h2{margin-top:0}nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px}button,input,select,textarea{font:inherit;border:1px solid #ddd;border-radius:10px;padding:10px;background:white;color:inherit}button{cursor:pointer}button.active,button.primary{background:#f5d348;border-color:#f5d348}section{background:white;border:1px solid #e5e5df;border-radius:18px;padding:20px;margin-bottom:14px}.line{display:flex;align-items:center;gap:9px;padding:12px 0;border-bottom:1px solid #eee;flex-wrap:wrap}.grow{flex:1;min-width:100px}.done{text-decoration:line-through;color:#888}.tag{padding:4px 9px;border-radius:6px;background:#eee}.A{background:#f8d9d5}.B{background:#ffedaa}.C{background:#dcebdc}small{color:#777}textarea{width:100%;min-height:85px}input[type=checkbox]{width:20px;height:20px;accent-color:#d8b000}progress{width:100%;accent-color:#e7c331} .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tile{background:#f7f7f4;padding:14px;border-radius:12px}.tile strong{font-size:26px;display:block} @media(max-width:500px){header,main{padding:12px}section{padding:14px}.tiles{gap:5px}.tile{padding:9px}button{padding:8px;font-size:14px}}.timer-card{text-align:center}.timer-tabs,.timer-presets,.timer-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px 0}.timer-tabs button{flex:1}.timer-ring{width:190px;height:190px;margin:12px auto;position:relative}.timer-ring svg{width:100%;height:100%;transform:rotate(-90deg)}.timer-face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.timer-face strong{font-size:42px;font-variant-numeric:tabular-nums}.timer-actions .primary{min-width:140px}.timer-custom{margin:12px auto;max-width:180px}.timer-custom input{width:100%;text-align:center}</style><header><h1>my<span style="color:#c9a400">focus.</span></h1><small id="today"></small></header><main><nav id="nav"></nav><p id="storage-warning" hidden>Браузер не разрешает сохранение данных. Экспортируй резервную копию перед закрытием.</p><div id="app">Если этот текст не исчезает, JavaScript не запустился. Открой приложение как веб-сайт или в другом браузере.</div></main><script>window.addEventListener("error",function(e){document.getElementById("app").textContent="Ошибка запуска: "+e.message;});</script><script>
const $=id=>document.getElementById(id), day=()=>new Date().toLocaleDateString('sv-SE'), uid=()=>typeof crypto!=="undefined"&&crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();let s;try{s=JSON.parse(localStorage.getItem('myfocus-v1'))}catch{}s=s||{tasks:[],lists:[],projects:[],blocks:[],energy:{},freeze:[],review:{}};let page='Мой день',timer=null,seconds=1500;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persistStorage(){try{localStorage.setItem('myfocus-v1',JSON.stringify(s))}catch(e){document.getElementById('storage-warning').hidden=false}}function save(){persistStorage();render()}function add(cat){let lines=$('new').value.split('\n').map(x=>x.trim()).filter(Boolean),due=$('due').value;for(let name of lines)s.tasks.push({id:uid(),name,cat,due,created:Date.now(),done:false,project:$('project')?.value||'',repeat:$('repeat')?.value||'',steps:[],effort:$('effort')?.value||'',auto:cat==='I'});save()}function task(id){return s.tasks.find(t=>t.id===id)}function toggle(id){let t=task(id);t.done=!t.done;t.completed=t.done?day():'';for(let b of s.blocks.filter(b=>b.ids.includes(id))){if(b.ids.every(id=>task(id)?.done))b.closed=true;else if(!t.done)b.closed=false;}if(t.done&&t.repeat){let d=new Date((t.due||day())+'T12:00:00');d.setDate(d.getDate()+Number(t.repeat));while(d.toLocaleDateString('sv-SE')<=day())d.setDate(d.getDate()+Number(t.repeat));let next={...t,id:uid(),due:d.toLocaleDateString('sv-SE'),done:false,completed:'',steps:t.steps.map(x=>({...x,done:false})),origin:t.id};if(!s.tasks.some(x=>x.origin===t.id))s.tasks.push(next)}save()}function change(id,k,v){task(id)[k]=v;save()}function del(id){if(confirm('Удалить задачу?')){s.tasks=s.tasks.filter(t=>t.id!==id);save()}}function effortOptions(v=""){return [["","Не указана"],["light","Лёгкая"],["medium","Средняя"],["heavy","Высокая"]].map(([k,n])=>`<option value="${k}" ${v===k?"selected":""}>${n}</option>`).join("")}function row(t){return `<div class="line"><input type="checkbox" ${t.done?'checked':''} onchange="toggle('${t.id}')"><span class="tag ${t.cat}">${t.cat==='I'?'Inbox':t.cat}</span><span class="grow ${t.done?'done':''}">${esc(t.name)} ${t.effort?'<small> · '+({light:'Лёгкая',medium:'Средняя',heavy:'Высокая'}[t.effort]||'')+'</small>':''} ${t.due?'<small> · '+esc(t.due)+'</small>':''}</span><button onclick="edit('${t.id}')">Микрошаги ${t.steps?.length? t.steps.filter(x=>x.done).length+'/'+t.steps.length:'＋'}</button><button onclick="edit('${t.id}')">⋯</button></div>`}function edit(id){let t=task(id);$('app').innerHTML=`<section><h2>Задача</h2><input id="ename" value="${esc(t.name)}"><p>Категория <select id="ecat"><option value="auto" ${t.auto?'selected':''}>Автоматически</option>${['I','A','B','C'].map(c=>`<option ${!t.auto&&c===t.cat?'selected':''}>${c}</option>`).join('')}</select></p><p>Срок <input type="date" id="edue" value="${esc(t.due)}"></p><p>Трудоёмкость <select id="eeffort">${effortOptions(t.effort)}</select></p><p>Проект <select id="eproject">${projectOptions(t.project)}</select></p><p>Повтор <select id="erepeat">${repeatOptions(t.repeat)}</select></p><h3>Микрошаги</h3>${t.steps.map((x,i)=>`<div class="line"><input type="checkbox" ${x.done?'checked':''} onchange="task('${id}').steps[${i}].done=this.checked;persistStorage()">${esc(x.name)} <button onclick="persistEdit('${id}');promoteStep('${id}',${i})">В ABC</button><button onclick="persistEdit('${id}');task('${id}').steps.splice(${i},1);persistStorage();edit('${id}')">×</button></div>`).join('')}<input id="step" placeholder="Новый микрошаг"><button onclick="addStep('${id}')">+</button><p><button class="primary" onclick="persistEdit('${id}');render()">Сохранить</button> <button onclick="del('${id}')">Удалить</button></p></section>`}function addStep(id){let v=$('step').value.trim();if(!v)return;persistEdit(id);task(id).steps.push({name:v,done:false});persistStorage();edit(id)}function promoteStep(id,i){let t=task(id),x=t.steps[i];if(!x||x.done)return;let c=prompt('Категория A, B или C',t.cat==='I'?'C':t.cat);if(!['A','B','C'].includes(c))return;s.tasks.push({id:uid(),name:x.name,cat:c,due:t.due,project:t.project,repeat:'',done:false,steps:[]});t.steps.splice(i,1);persistStorage();edit(id)}function persistEdit(id){Object.assign(task(id),{name:$('ename').value,cat:$('ecat').value==='auto'?task(id).cat:$('ecat').value,auto:$('ecat').value==='auto'||$('ecat').value==='I',due:$('edue').value,effort:$('eeffort').value,project:$('eproject').value,repeat:$('erepeat').value});persistStorage()}function deleteProject(id){if(!confirm('Удалить проект?'))return;let remove=confirm('Удалить также все задачи проекта? Отмена — сохранить задачи без проекта.');if(remove){let ids=new Set(s.tasks.filter(t=>t.project===id).map(t=>t.id));s.tasks=s.tasks.filter(t=>!ids.has(t.id));s.blocks.forEach(b=>b.ids=b.ids.filter(x=>!ids.has(x)));}else s.tasks.forEach(t=>{if(t.project===id)t.project=''});s.projects=s.projects.filter(p=>p.id!==id);save()}function projectOptions(v=''){return '<option value="">Без проекта</option>'+s.projects.map(p=>`<option value="${p.id}" ${v===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}function repeatOptions(v=''){return [['','Нет'],['1','Ежедневно'],['7','Еженедельно'],['30','Каждые 30 дней']].map(([k,n])=>`<option value="${k}" ${v===k?'selected':''}>${n}</option>`).join('')}function form(cat){return `<section><textarea id="new" placeholder="Запиши всё, что приходит в голову. Каждая строка — отдельная задача."></textarea><div class="line"><input id="due" type="date"><select id="project">${projectOptions()}</select><select id="repeat">${repeatOptions()}</select><label>Трудоёмкость <select id="effort">${effortOptions()}</select></label><button class="primary" onclick="add('${cat}')">Добавить</button></div></section>`}function dueCategory(t){if(!t.due)return 'C';if(t.due<=day())return 'A';let d=new Date(day()+'T12:00:00');d.setDate(d.getDate()+Number(s.bWindow||7));return t.due<=d.toLocaleDateString('sv-SE')?'B':'C'}function classify(includeInbox=false){let changed=false;for(let t of s.tasks){if(t.done)continue;if(t.cat==='I'&&!includeInbox)continue;let c=dueCategory(t),old=t.cat;if(t.cat==='I'){t.auto=true;t.cat=c}else if(t.auto)t.cat=c;else if(t.due&&'ABC'.indexOf(c)<'ABC'.indexOf(t.cat))t.cat=c;if(old!==t.cat)changed=true}if(changed)persistStorage()}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function energyNow(){return s.energy[day()]||'Не отмечена'}function quotas(){return energyNow()==='Очень мало'&&s.shortBlock?[1,1,1]:[1,2,3]}function effortRank(t){let e=energyNow();if(e==='Мало'||e==='Очень мало')return ({light:0,medium:1,heavy:3}[t.effort]??1);if(e==='Много')return ({heavy:0,medium:1,light:2}[t.effort]??1);return 0}function block(go=false){classify(true);let used=new Set(s.blocks.filter(b=>b.date===day()).flatMap(b=>b.ids));let pool=s.tasks.filter(t=>!t.done&&!used.has(t.id));if(!pool.length){if(go)page='Мой день';save();return alert('Все доступные задачи уже в блоках или выполнены.')}do{let ids=[];for(let [c,n] of ['A','B','C'].map((c,i)=>[c,quotas()[i]])){let candidates=shuffle(pool.filter(t=>t.cat===c));if(c!=='C')candidates.sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')||(c==='B'?effortRank(a)-effortRank(b):0));else candidates=candidates.map(t=>({t,k:Math.random()**(1/(1+Math.min(30,Math.max(0,(Date.now()-(t.created||Date.now()))/86400000))/7))})).sort((a,b)=>b.k-a.k).map(x=>x.t).sort((a,b)=>effortRank(a)-effortRank(b));ids.push(...candidates.slice(0,n).map(t=>t.id))}if(!ids.length)break;s.blocks.push({id:uid(),date:day(),ids,target:quotas().reduce((a,b)=>a+b,0),energy:energyNow()});pool=pool.filter(t=>!ids.includes(t.id))}while(pool.some(t=>t.cat==='A'));if(go)page='Мой день';save()}function flipBlock(id){let b=s.blocks.find(x=>x.id===id);b.closed=!(b.closed??(b.ids.length>0&&b.ids.every(id=>task(id)?.done)));save()}function replace(bid,i,id){let b=s.blocks.find(x=>x.id===bid);b.ids[i]=id;save()}function streak(){let dates=new Set(s.tasks.filter(t=>t.completed).map(t=>t.completed).concat(s.freeze));let d=new Date();if(!dates.has(day()))d.setDate(d.getDate()-1);let n=0;while(dates.has(d.toLocaleDateString('sv-SE'))){n++;d.setDate(d.getDate()-1)}return n}function timerText(){return Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0')}let timerEnd=0,timerMode='Работа',durations={'Работа':25,'Отдых':5};function paintTimer(){if($('clock'))$('clock').textContent=timerText();if($('ring'))$('ring').setAttribute('stroke-dasharray',`${565.49*Math.min(1,seconds/(durations[timerMode]*60))} 565.49`)}function pauseTimer(){if(timerEnd)seconds=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));clearInterval(timer);timerEnd=0;render()}function resumeTimer(){if(!seconds)seconds=durations[timerMode]*60;clearInterval(timer);timerEnd=Date.now()+seconds*1000;timer=setInterval(()=>{seconds=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));paintTimer();if(!seconds){clearInterval(timer);timerEnd=0;render()}},250);render()}function selectTimer(n,mode=timerMode){if(!Number.isFinite(n)||n<=0||n>1440)return;clearInterval(timer);timerEnd=0;timerMode=mode;durations[mode]=n;seconds=Math.round(n*60);render()}function resetTimer(){selectTimer(durations[timerMode])}function timerCard(){return `<section class="timer-card"><div class="timer-tabs">${['Работа','Отдых'].map(m=>`<button class="${m===timerMode?'active':''}" onclick="selectTimer(durations['${m}'],'${m}')">${m==='Работа'?'Фокус':'Перерыв'}</button>`).join('')}</div><div class="timer-ring"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="90" fill="none" stroke="#eee" stroke-width="7"/><circle id="ring" cx="100" cy="100" r="90" fill="none" stroke="#e7c331" stroke-width="7" stroke-linecap="round" stroke-dasharray="${565.49*Math.min(1,seconds/(durations[timerMode]*60))} 565.49"/></svg><div class="timer-face"><strong id="clock">${timerText()}</strong><small>${timerMode==='Работа'?'ВРЕМЯ ФОКУСА':'ВРЕМЯ ОТДЫХА'}</small></div></div><div class="timer-presets">${(timerMode==='Работа'?[5,10,15,25,45,60]:[5,10,15,20]).map(n=>`<button class="${durations[timerMode]===n?'active':''}" onclick="selectTimer(${n})">${n}</button>`).join('')}</div><details class="timer-custom"><summary>Своё время</summary><input type="number" min="1" max="1440" placeholder="Минуты" onchange="selectTimer(Number(this.value))"></details><div class="timer-actions"><button class="primary" onclick="${timerEnd?'pauseTimer()':'resumeTimer()'}">${timerEnd?'Пауза':seconds===durations[timerMode]*60||!seconds?'Начать':'Продолжить'}</button><button onclick="resetTimer()">Сброс</button></div></section>`}function render(){ s.energy=s.energy||{}; classify(); $('today').textContent=new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long',weekday:'long'});$('nav').innerHTML=['Мой день','Inbox','ABC','Проекты','Списки','Статистика','Календарь','Обзор'].map(p=>`<button class="${p===page?'active':''}" onclick="page='${p}';render()">${p}</button>`).join('');let h='',done=s.tasks.filter(t=>t.done),todayDone=done.filter(t=>t.completed===day());if(page==='Inbox')h=form('I')+`<section><h2>Inbox</h2><button onclick="classify(true);save()">Распределить автоматически</button>${s.tasks.filter(t=>t.cat==='I').map(row).join('')||'<small>Здесь пока пусто.</small>'}</section>`;if(page==='ABC')h=`<section><button class="primary" onclick="block(true)">Собрать фокус-блок автоматически</button><p><button onclick="classify(true);save()">Распределить Inbox</button></p><label>Категория B: ближайшие <select onchange="s.bWindow=Number(this.value);save()">${[3,7,14,30].map(n=>`<option ${Number(s.bWindow||7)===n?'selected':''}>${n}</option>`).join('')}</select> дней</label></section>`+['A','B','C'].map(c=>`<section><h2>${c} · ${{A:'Срочные',B:'Приближающиеся',C:'Несрочные'}[c]}</h2>${s.tasks.filter(t=>t.cat===c).sort((a,b)=>a.done-b.done).map(row).join('')||'<small>Нет задач</small>'}<button onclick="page='Inbox';render()">Добавить через Inbox</button></section>`).join('');if(page==='Мой день'){h=`<section><div class="tiles"><div class="tile"><small>Серия</small><strong>🔥 ${streak()}</strong></div><div class="tile"><small>Сегодня</small><strong>${todayDone.length}</strong></div><div class="tile"><small>Inbox</small><strong>${s.tasks.filter(t=>t.cat==='I'&&!t.done).length}</strong></div></div><p>Энергия сегодня <select onchange="s.energy[day()]=this.value;save()">${['Не отмечена','Очень мало','Мало','Нормально','Много'].map(x=>`<option ${s.energy[day()]===x?'selected':''}>${x}</option>`).join('')}</select></p>${energyNow()==='Очень мало'?`<label><input type="checkbox" ${s.shortBlock?'checked':''} onchange="s.shortBlock=this.checked;save()"> Облегчённый блок 1A + 1B + 1C</label>`:''}<p><small>${({'Очень мало':'Приоритет лёгким задачам. Срочные сроки сохраняются.','Мало':'Предпочтение небольшим задачам.','Много':'Предпочтение трудоёмким задачам при равной срочности.','Нормально':'Стандартный подбор по срокам и давности.'})[energyNow()]||'Отметь энергию, чтобы адаптировать подбор.'} Изменения действуют на новые блоки.</small></p><button class="primary" onclick="block()">＋ Собрать фокус-блок</button></section>`;h+=s.blocks.filter(b=>b.date===day()).map((b,i)=>{let ts=b.ids.map(task).filter(Boolean),n=ts.filter(t=>t.done).length,closed=b.closed??(n>0&&n===ts.length);return `<section><h2><button onclick="flipBlock('${b.id}')">${closed?'▸':'▾'}</button> Фокус-блок ${i+1} · ${n}/${ts.length}</h2><progress max="${ts.length||1}" value="${n}"></progress>${closed?'':ts.map(row).join('')}${ts.length<(b.target||6)?'<p><small>Неполный блок: недостаточно свободных задач нужных категорий.</small></p>':''}${n===ts.length&&n?'<p>✓ Блок завершён!</p>':''}<button onclick="swap('${b.id}')">Заменить задачу</button></section>`}).join('');h+=timerCard()+`<section><h2>Сделано сегодня</h2>${todayDone.map(row).join('')||'<small>Выполненные дела появятся здесь.</small>'}</section>`}if(page==='Проекты')h=`<section><input id="pn" placeholder="Название проекта"><button onclick="if($('pn').value.trim()){s.projects.push({id:uid(),name:$('pn').value});save()}">Добавить</button></section>`+s.projects.map(p=>{let ts=s.tasks.filter(t=>t.project===p.id);return `<section><h2>${esc(p.name)}</h2><button onclick="deleteProject('${p.id}')">Удалить проект</button><small>${ts.filter(t=>t.done).length}/${ts.length}</small>${ts.map(row).join('')}</section>`}).join('');if(page==='Списки')h=`<section><input id="ln" placeholder="Название списка"><button onclick="if($('ln').value.trim()){s.lists.push({id:uid(),name:$('ln').value,items:[]});save()}">Создать</button></section>`+s.lists.map(l=>`<section><h2>${esc(l.name)}</h2>${l.items.map((x,i)=>`<div class="line"><input type="checkbox" ${x.done?'checked':''} onchange="getShoppingList('${l.id}').items[${i}].done=this.checked;save()"><span class="grow ${x.done?'done':''}">${esc(x.name)}</span><button onclick="getShoppingList('${l.id}').items.splice(${i},1);save()">×</button></div>`).join('')}<p><input id="li${l.id}" placeholder="Новый пункт"><button onclick="addItem('${l.id}')">+</button></p><button onclick="getShoppingList('${l.id}').items.forEach(x=>x.done=false);save()">Снять отметки</button></section>`).join('');if(page==='Статистика')h=`<section><h2>Прогресс</h2><div class="tiles">${['A','B','C'].map(c=>`<div class="tile"><small>${c}</small><strong>${done.filter(t=>t.cat===c).length}</strong></div>`).join('')}</div><p>Всего выполнено: ${done.length}</p><p>Серия: ${streak()} дней</p><p>Полных блоков: ${s.blocks.filter(b=>b.ids.length===(b.target||6)&&b.ids.every(id=>task(id)?.done)).length}</p><button onclick="if(!s.freeze.includes(day())){s.freeze.push(day());save()}">Отметить сегодня как день отдыха</button></section><section><h2>Последние 7 дней</h2>${Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);let k=d.toLocaleDateString('sv-SE'),n=done.filter(t=>t.completed===k).length;ret
